name: FastAPI CI Pipeline

# Указываем, при каких событиях запускается робот
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Шаги, которые выполняет виртуальная машина GitHub
    steps:
      # 1. Скачиваем исходный код репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Python нужной версии
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # кэшируем зависимости для скорости

      # 3. Устанавливаем зависимости проекта
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Проверяем, что проект запускается / прогоняем тесты (если они есть)
      - name: Run lint or basic check
        run: |
          echo "Dependencies installed successfully. Project is ready!"
          # Здесь в будущем можно добавить pytest или flake8