version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
     - "5432:5432"
    volumes:
     - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: backend_service
    # Убираем ports: - "8000:8000" наружу, 
    # теперь бэкенд доступен только внутри закрытой сети Docker для Nginx!
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres_db:5432/postgres
    depends_on:
      postgres_db:
        condition: service_healthy
  
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"  # Выводим 80-й порт наружу в мир
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  postgres_data:
  
  